# Every tool that the repo needs is pinned here. `mise install` installs them.

[tools]
python = "3.14.8"
uv = "0.13.1"
ruff = "0.17.0"
"pipx:pyrefly" = "1.3.2"
lefthook = "2.2.2"
cocogitto = "7.0.0"
gitleaks = "8.30.1"
rumdl = "0.2.79"

[tasks.install]
description = "Install the locked dependencies"
run = "uv sync --locked"

[tasks.setup]
description = "Install the dependencies and the git hooks"
depends = ["install"]
run = "lefthook install"

[tasks.run]
description = "Create a Checkout Session in Stripe test mode and print its URL"
run = "uv run python src/main.py"

[tasks.test]
description = "Run the tests"
run = "uv run pytest"

[tasks."lint:py"]
description = "ruff with every rule, the ruff format check, and the pyrefly type check"
run = ["ruff check .", "ruff format --check .", "pyrefly check"]

[tasks."lint:md"]
description = "Markdown structure and formatting"
run = "rumdl check ."

[tasks."lint:secrets"]
description = "Scan the working tree for committed secrets"
run = "gitleaks dir . --no-banner"

[tasks.lint]
description = "Every linter"
depends = ["lint:py", "lint:md", "lint:secrets"]

[tasks.format]
description = "Apply every formatter and every safe lint fix"
run = ["ruff check --fix .", "ruff format .", "rumdl check --fix ."]

[tasks.check]
description = "The gate: run it before you finish a change"
run = ["mise run lint", "mise run test"]

[tasks.ci]
description = "Run exactly what CI runs. The pre-push hook and the CI workflow call it"
run = ["mise run install", "mise run check"]
